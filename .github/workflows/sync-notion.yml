name: Sync TCE-GO from Notion

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/sync-tce-go.mjs"
      - "scripts/notion-public-content.mjs"
      - "scripts/snapshot-contract.mjs"
      - "scripts/import-edge-snapshot.mjs"
      - "supabase/functions/tce-public-snapshot/**"
      - ".github/workflows/sync-notion.yml"
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write
  actions: write
  id-token: write

concurrency:
  group: tce-go-notion-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Select sync transport
        id: config
        env:
          TCE_GO_NOTION_TOKEN: ${{ secrets.TCE_GO_NOTION_TOKEN }}
        shell: bash
        run: |
          if [ -n "$TCE_GO_NOTION_TOKEN" ]; then
            echo "mode=direct" >> "$GITHUB_OUTPUT"
          else
            echo "mode=edge" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract directly from Notion
        if: steps.config.outputs.mode == 'direct'
        env:
          TCE_GO_NOTION_TOKEN: ${{ secrets.TCE_GO_NOTION_TOKEN }}
          TCE_GO_DAYS_DATA_SOURCE_ID: ${{ vars.TCE_GO_DAYS_DATA_SOURCE_ID }}
          NOTION_VERSION: "2026-03-11"
        run: |
          node scripts/sync-tce-go.mjs
          node scripts/validate-tce-go-snapshot.mjs

      - name: Request GitHub OIDC token
        if: steps.config.outputs.mode == 'edge' || github.event_name != 'schedule'
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=tce-go-sync")"
          token="$(node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).value))' <<<"$response")"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Extract through authenticated Edge bridge
        if: steps.config.outputs.mode == 'edge'
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --retry 3 --retry-delay 2 -H "Authorization: Bearer $OIDC_TOKEN" -o /tmp/tce-go-edge-snapshot.json -w "%{http_code}" "https://fqqkkyusnzhuuizahkww.supabase.co/functions/v1/tce-public-snapshot")"
          if [ "$code" = "503" ]; then
            echo "::warning::Sync periódico preservou o último snapshot válido: credencial/acesso Notion server-side do TCE-GO indisponível."
            exit 0
          fi
          if [ "$code" != "200" ]; then
            echo "::error::Edge bridge retornou HTTP $code."
            cat /tmp/tce-go-edge-snapshot.json || true
            exit 1
          fi
          node scripts/import-edge-snapshot.mjs /tmp/tce-go-edge-snapshot.json
          node scripts/validate-tce-go-snapshot.mjs

      - name: Audit Edge fallback health
        if: steps.config.outputs.mode == 'direct' && github.event_name != 'schedule'
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --retry 3 --retry-delay 2 -H "Authorization: Bearer $OIDC_TOKEN" -o /tmp/tce-go-edge-health.json -w "%{http_code}" "https://fqqkkyusnzhuuizahkww.supabase.co/functions/v1/tce-public-snapshot?health=1")"
          if [ "$code" != "200" ]; then
            echo "::error::Health do fallback Edge retornou HTTP $code."
            cat /tmp/tce-go-edge-health.json || true
            exit 1
          fi
          node - <<'NODE'
          const fs = require("fs");
          const h = JSON.parse(fs.readFileSync("/tmp/tce-go-edge-health.json", "utf8"));
          const errors = [];
          const exact = {
            ok: true,
            notionConfigured: true,
            contentMode: "full",
            auxiliaryMode: "full",
            totalDays: 100,
            activeDays: 47,
            protectedDays: 53,
            readyDays: 47,
            sessions: 47,
            redactionPlans: 8,
            simulationPlans: 6,
            editalItems: 15,
            finalSprintDays: 17,
          };
          for (const [key, expected] of Object.entries(exact)) {
            if (h[key] !== expected) errors.push(`${key}: esperado ${expected}; recebido ${h[key]}`);
          }
          if (!Number.isInteger(h.legislationSources) || h.legislationSources < 1) {
            errors.push(`legislationSources inválido: ${h.legislationSources}`);
          }
          if (errors.length) throw new Error("Fallback Edge inconsistente:\n- " + errors.join("\n- "));
          console.log(`Fallback Edge health validado: 100 dias, 47 sessões, R1–R8, 6 marcos, 15 itens de edital, ${h.legislationSources} fontes legais e 17 dias de reta final.`);
          NODE

      - name: Check diff integrity
        run: git diff --check

      - name: Detect real snapshot changes
        id: diff
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- public/data)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No public snapshot changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit snapshot only when changed
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "chore: sync sanitized TCE-GO snapshot"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish changed snapshot
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy-pages.yml --ref main
          echo "Deploy do Pages disparado explicitamente para o snapshot recém-sincronizado."
