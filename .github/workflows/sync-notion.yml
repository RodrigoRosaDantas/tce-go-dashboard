name: Sync TCE-GO from Notion

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/sync-tce-go.mjs"
      - "scripts/notion-public-content.mjs"
      - "scripts/snapshot-contract.mjs"
      - "scripts/import-edge-snapshot.mjs"
      - "supabase/functions/tce-public-snapshot/**"
      - ".github/workflows/sync-notion.yml"
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write
  id-token: write

concurrency:
  group: tce-go-notion-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Select sync transport
        id: config
        env:
          TCE_GO_NOTION_TOKEN: ${{ secrets.TCE_GO_NOTION_TOKEN }}
        shell: bash
        run: |
          if [ -n "$TCE_GO_NOTION_TOKEN" ]; then
            echo "mode=direct" >> "$GITHUB_OUTPUT"
          else
            echo "mode=edge" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract directly from Notion
        if: steps.config.outputs.mode == 'direct'
        env:
          TCE_GO_NOTION_TOKEN: ${{ secrets.TCE_GO_NOTION_TOKEN }}
          TCE_GO_DAYS_DATA_SOURCE_ID: ${{ vars.TCE_GO_DAYS_DATA_SOURCE_ID }}
          NOTION_VERSION: "2026-03-11"
        run: |
          node scripts/sync-tce-go.mjs
          node scripts/validate-tce-go-snapshot.mjs

      - name: Request GitHub OIDC token
        if: steps.config.outputs.mode == 'edge'
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=tce-go-sync")"
          token="$(node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).value))' <<<"$response")"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Extract through authenticated Edge bridge
        if: steps.config.outputs.mode == 'edge'
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --retry 3 --retry-delay 2 -H "Authorization: Bearer $OIDC_TOKEN" -o /tmp/tce-go-edge-snapshot.json -w "%{http_code}" "https://fqqkkyusnzhuuizahkww.supabase.co/functions/v1/tce-public-snapshot")"
          if [ "$code" = "503" ]; then
            echo "::warning::Sync periódico preservou o último snapshot válido: TCE_GO_NOTION_TOKEN ainda não está disponível no ambiente server-side."
            exit 0
          fi
          if [ "$code" != "200" ]; then
            echo "::error::Edge bridge retornou HTTP $code."
            cat /tmp/tce-go-edge-snapshot.json || true
            exit 1
          fi
          node scripts/import-edge-snapshot.mjs /tmp/tce-go-edge-snapshot.json
          node scripts/validate-tce-go-snapshot.mjs

      - name: Check diff integrity
        run: git diff --check

      - name: Detect real snapshot changes
        id: diff
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- public/data)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No public snapshot changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit snapshot only when changed
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "chore: sync sanitized TCE-GO snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
