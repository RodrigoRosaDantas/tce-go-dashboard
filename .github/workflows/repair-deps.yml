name: Repair TCE-GO dependency audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-deps.yml"

permissions:
  contents: write

concurrency:
  group: tce-go-dependency-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade Vite and regenerate lockfile
        run: |
          npm install --save-dev --save-exact vite@8.3.0 --package-lock-only
          npm pkg set 'scripts.audit=npm audit --audit-level=high'

      - name: Install exact dependency graph
        run: npm ci

      - name: Full quality gate
        env:
          GITHUB_PAGES: "1"
          GITHUB_PAGES_BASE_PATH: "/tce-go-dashboard"
        run: npm run quality

      - name: Check diff integrity
        run: git diff --check

      - name: Commit repaired dependency graph and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git rm .github/workflows/repair-deps.yml
          if git diff --cached --quiet; then
            echo "No repair changes detected."
            exit 0
          fi
          git commit -m "fix: patch Vite advisory and audit full dependency tree"
          git pull --rebase origin main
          git push origin HEAD:main
