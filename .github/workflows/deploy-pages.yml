name: Deploy TCE-GO to GitHub Pages

on:
  workflow_run:
    workflows: ["TCE-GO Quality"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tce-go-pages
  cancel-in-progress: true

jobs:
  preflight:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    outputs:
      pages_ready: ${{ steps.pages.outputs.ready }}
    steps:
      - name: Check whether GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api --silent "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is enabled."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages is not enabled yet. In Settings → Pages, set Source to GitHub Actions, then run this workflow again."
          fi

  build:
    needs: preflight
    if: ${{ needs.preflight.outputs.pages_ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Re-run quality gate before deploy
        run: |
          npm run lint
          npm run audit
          npm run validate:snapshot
          git diff --check
          npm run build
          npm test
        env:
          GITHUB_PAGES: "1"
          GITHUB_PAGES_BASE_PATH: "/tce-go-dashboard"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Smoke test published site
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          routes=(
            ""
            "dias/"
            "dia/d001/"
            "questoes/q001/"
            "dia/d050/"
            "questoes/q050/"
            "dia/d100/"
            "questoes/q100/"
            "revisoes/"
            "redacoes/"
            "erros/"
            "simulados/"
            "desempenho/"
            "edital/"
            "legislacao/"
            "reta-final/"
            "sync/"
          )
          for route in "${routes[@]}"; do
            url="${base}/${route}"
            code="$(curl --retry 5 --retry-delay 2 --retry-all-errors -sS -o /tmp/tce-page.html -w "%{http_code}" "$url")"
            if [ "$code" != "200" ]; then
              echo "::error::Smoke test falhou em $url (HTTP $code)"
              exit 1
            fi
          done

          for asset in "manifest.webmanifest" "sw.js" "data/tce-go-snapshot.json"; do
            url="${base}/${asset}"
            code="$(curl --retry 5 --retry-delay 2 --retry-all-errors -sS -o /tmp/tce-asset -w "%{http_code}" "$url")"
            if [ "$code" != "200" ]; then
              echo "::error::Asset público indisponível: $url (HTTP $code)"
              exit 1
            fi
          done

          curl --retry 5 --retry-delay 2 --retry-all-errors -sS "${base}/data/tce-go-snapshot.json" -o /tmp/tce-snapshot.json
          node - <<'NODE'
          const fs = require("fs");
          const s = JSON.parse(fs.readFileSync("/tmp/tce-snapshot.json", "utf8"));
          const m = Object.keys(s.materials || {}).length;
          const q = Object.keys(s.questions || {}).length;
          const r = Array.isArray(s.redactions) ? s.redactions.length : 0;
          const sim = Array.isArray(s.simulations) ? s.simulations.length : 0;
          const ed = Array.isArray(s.edital) ? s.edital.length : 0;
          const leg = Array.isArray(s.legislation) ? s.legislation.length : 0;
          const rf = Array.isArray(s.finalSprint) ? s.finalSprint.length : 0;
          if (
            s.contentMode !== "full" || s.auxiliaryMode !== "full"
            || s.publicStats?.totalDays !== 100 || s.publicStats?.activeDays !== 47
            || s.publicStats?.protectedDays !== 53 || s.publicStats?.sessions !== 47
            || m !== 47 || q !== 47 || r !== 8 || sim !== 6 || ed !== 15 || leg < 1 || rf !== 17
          ) {
            throw new Error(`Snapshot público incompleto: mode=${s.contentMode}/${s.auxiliaryMode}, days=${s.publicStats?.totalDays}, active=${s.publicStats?.activeDays}, protected=${s.publicStats?.protectedDays}, sessions=${s.publicStats?.sessions}, materials=${m}, questions=${q}, redactions=${r}, simulations=${sim}, edital=${ed}, legislation=${leg}, finalSprint=${rf}`);
          }
          const protectedWithSession = (s.days || []).filter(d => d.protected && d.session).length;
          if (protectedWithSession !== 0) throw new Error(`Dias protegidos com Sxx: ${protectedWithSession}`);
          console.log(`Snapshot full validado no site publicado: 47/47 + R1–R8 + 6 marcos + 15 itens de edital + ${leg} fontes legais + 17 dias de reta final.`);
          NODE

          fallback_code="$(curl --retry 5 --retry-delay 2 --retry-all-errors -sS -o /tmp/tce-fallback.html -w "%{http_code}" "${base}/rota-inexistente-smoke/")"
          if [ "$fallback_code" != "404" ]; then
            echo "::error::Fallback esperado HTTP 404; recebido $fallback_code"
            exit 1
          fi
          grep -q '<div id="root"></div>' /tmp/tce-fallback.html
          echo "Smoke test publicado concluído: 17 rotas + snapshot full editorial/auxiliar + PWA + fallback."
