name: TCE-GO Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tce-go-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and type-check
        run: npm run lint

      - name: Audit dependency tree
        run: npm run audit

      - name: Validate sanitized snapshot
        run: npm run validate:snapshot

      - name: Check repository diff
        run: git diff --check

      - name: Build for GitHub Pages
        run: npm run build
        env:
          GITHUB_PAGES: "1"
          GITHUB_PAGES_BASE_PATH: "/tce-go-dashboard"

      - name: Run tests
        run: npm test
