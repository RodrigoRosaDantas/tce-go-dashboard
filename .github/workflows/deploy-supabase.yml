name: Deploy TCE-GO Supabase Function

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/tce-progress/**"
      - "supabase/functions/tce-public-snapshot/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase.yml"

permissions:
  contents: read

concurrency:
  group: tce-go-supabase-function
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: fqqkkyusnzhuuizahkww
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check deploy credential
        id: config
        shell: bash
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Edge Function source is versioned, but deploy is inactive until SUPABASE_ACCESS_TOKEN is configured."
          fi

      - name: Setup Supabase CLI
        if: steps.config.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy tce-progress
        if: steps.config.outputs.ready == 'true'
        run: supabase functions deploy tce-progress --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy tce-public-snapshot
        if: steps.config.outputs.ready == 'true'
        run: supabase functions deploy tce-public-snapshot --project-ref "$SUPABASE_PROJECT_ID"
