name: Deploy TCE-GO Supabase Function

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/tce-progress/**"
      - "supabase/functions/tce-public-snapshot/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase.yml"

permissions:
  contents: read

concurrency:
  group: tce-go-supabase-function-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_ACESS_TOKEN }}
      SUPABASE_PROJECT_ID: fqqkkyusnzhuuizahkww
      TCE_GO_NOTION_TOKEN: ${{ secrets.TCE_GO_NOTION_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check deploy credential
        id: config
        shell: bash
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Edge Function source is versioned, but deploy is inactive until SUPABASE_ACCESS_TOKEN is configured."
          fi

      - name: Setup Supabase CLI
        if: steps.config.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Sync and check TCE-GO runtime secret
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$TCE_GO_NOTION_TOKEN" ]; then
            echo "::error::Secret TCE_GO_NOTION_TOKEN não está configurado no GitHub Actions."
            exit 1
          fi
          supabase secrets set TCE_GO_NOTION_TOKEN="$TCE_GO_NOTION_TOKEN" --project-ref "$SUPABASE_PROJECT_ID" >/dev/null
          supabase secrets list --project-ref "$SUPABASE_PROJECT_ID" > /tmp/tce-go-secrets.txt
          if ! grep -Eq '(^|[[:space:]|])TCE_GO_NOTION_TOKEN([[:space:]|]|$)' /tmp/tce-go-secrets.txt; then
            echo "::error::Secret TCE_GO_NOTION_TOKEN não foi sincronizado com o Supabase."
            exit 1
          fi
          echo "Secret TCE_GO_NOTION_TOKEN sincronizado GitHub → Supabase (valor não exposto)."

      - name: Deploy tce-progress
        if: steps.config.outputs.ready == 'true'
        run: supabase functions deploy tce-progress --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy tce-public-snapshot
        if: steps.config.outputs.ready == 'true'
        run: supabase functions deploy tce-public-snapshot --project-ref "$SUPABASE_PROJECT_ID"
