name: V3 Visual QA

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "public/data/**"
      - "scripts/visual-smoke-v3.mjs"
      - "scripts/e2e-study-os.mjs"
      - ".github/workflows/v3-visual.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start Vite preview with production base path
        env:
          GITHUB_PAGES: "1"
          GITHUB_PAGES_BASE_PATH: "/tce-go-dashboard"
        run: |
          npm run build
          npm exec vite -- preview --host 127.0.0.1 --port 4173 > /tmp/tce-v3-preview.log 2>&1 &
          echo $! > /tmp/tce-v3-preview.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/tce-go-dashboard/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/tce-v3-preview.log
          exit 1
      - name: Run geometry and screenshot QA
        env:
          V3_VISUAL_BASE_URL: "http://127.0.0.1:4173/tce-go-dashboard"
        run: node scripts/visual-smoke-v3.mjs
      - name: Run Study OS interaction E2E
        env:
          V4_E2E_BASE_URL: "http://127.0.0.1:4173/tce-go-dashboard"
        run: node scripts/e2e-study-os.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v3-visual-qa
          path: artifacts/v3-visual
          if-no-files-found: warn
          retention-days: 7
